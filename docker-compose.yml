services:
  mysql:
    image: mysql:8.0
    container_name: delivery-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: America/Sao_Paulo
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  api-java:
    build: ./api-java
    container_name: delivery-api-java
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: delivery_db
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  api-csharp:
    build: ./api-csharp
    container_name: delivery-api-csharp
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: delivery_db
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: delivery-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "3000:80"
    depends_on:
      - api-java
      - api-csharp

volumes:
  mysql_data:
